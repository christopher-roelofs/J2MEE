<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>j2me wasm POC</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0;
    background: #111; color: #ddd;
    font: 14px/1.4 system-ui, sans-serif;
    height: 100%;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 16px; gap: 12px;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 4px 0; color: #eee; }
  /* Canvas backing store is @J2ME_WEB_W@×@J2ME_WEB_H@ (baked from J2ME_WEB_RES
     at build time). Display box is fixed at 2× the backing store so the
     browser can pixel-perfect upscale. image-rendering: pixelated keeps
     the upscale crisp — no antialiasing. */
  canvas#canvas {
    display: block;
    background: #000;
    border: 1px solid #333;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width:  @J2ME_WEB_CSS_W@px;
    height: @J2ME_WEB_CSS_H@px;
  }
  canvas#canvas:focus { outline: 2px solid #4a9; outline-offset: 2px; }
  #log {
    width: 680px; max-width: 96vw; height: 160px;
    background: #0a0a0a; border: 1px solid #222;
    padding: 8px; font: 12px/1.3 ui-monospace, monospace;
    white-space: pre-wrap; overflow-y: auto;
    color: #9c9;
  }
  #hint { color: #777; font-size: 12px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .controls kbd {
    background: #222; border: 1px solid #444; border-radius: 3px;
    padding: 1px 6px; font: 11px ui-monospace, monospace; color: #ccc;
  }
</style>
</head>
<body>
  <h1>j2me wasm POC</h1>
  <canvas id="canvas" width="@J2ME_WEB_W@" height="@J2ME_WEB_H@" tabindex="0"></canvas>
  <div id="hint">Keyboard focus: click the canvas. First click also enables audio.</div>
  <div class="controls">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move</span>
    <span><kbd>Space</kbd>/<kbd>Z</kbd>/<kbd>Enter</kbd> select</span>
    <span><kbd>Shift</kbd>/<kbd>F1</kbd>/<kbd>F2</kbd> soft keys</span>
    <span>mouse = touch</span>
  </div>
  <pre id="log"></pre>

<script type="text/javascript">
  const logEl = document.getElementById('log');
  const append = (txt) => {
    logEl.textContent += txt;
    logEl.scrollTop = logEl.scrollHeight;
  };
  const canvas = document.getElementById('canvas');

  // Audio: every AudioContext is suspended until the user gestures. Resume
  // on the first click / tap / key press. No UI blocker. Walks both known
  // emscripten audio-backend locations — SDL2 populates one, OpenAL the
  // other, depending on which subsystem touched audio first.
  function resumeAudio() {
    const ctxs = [];
    try {
      if (typeof Module !== 'undefined' && Module.SDL2 &&
          Module.SDL2.audioContext) ctxs.push(Module.SDL2.audioContext);
    } catch (_) {}
    try {
      if (typeof AL !== 'undefined' && AL.contexts) {
        for (const k in AL.contexts) {
          const c = AL.contexts[k];
          if (c && c.audioCtx) ctxs.push(c.audioCtx);
        }
      }
    } catch (_) {}
    let resumed = false;
    for (const c of ctxs) {
      try {
        if (c.state === 'suspended') { c.resume(); resumed = true; }
      } catch (e) { console.warn('resume audio:', e); }
    }
    if (resumed) append('[audio] AudioContext resumed\n');
    else if (ctxs.length === 0) append('[audio] no AudioContext yet — game may not have started audio subsystem\n');
  }
  ['click','touchstart','keydown','pointerdown'].forEach(ev => {
    document.addEventListener(ev, resumeAudio, { capture: true });
  });
  canvas.addEventListener('click', () => canvas.focus());

  var Module = {
    canvas: canvas,
    print:      (t) => { console.log(t); append(t + '\n'); },
    printErr:   (t) => { console.warn(t); append('! ' + t + '\n'); },
    setStatus:  (t) => { if (t) append('[status] ' + t + '\n'); },
    onRuntimeInitialized: () => append('[runtime] ready — MIDlet starting\n'),
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
